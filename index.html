<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Night/Day Cycle</title>

<style>
  :root{
    /* ✅ “기준 폭” */
    --baseW: 1100;

    --cardBg: rgba(255,255,255,0.70);
    --border: #111;

    /* ✅ duty 이미지 크기(줄임) */
    --dutyW: 520px;   /* ✅ 더 작게 */
    --dutyH: auto;
    --dutyMaxH: 90px; /* ✅ 너무 큰 이미지여도 이 높이 안에서 축소 */

    /* ✅ 카드 전체를 현재의 80%로 */
    --cardScale: 0.8;
  }

  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    background:#000;
    font-family: Arial, Helvetica, sans-serif;
    color:#111;
  }

  /* 배경(밤/낮) */
  #bg{
    position:fixed;
    inset:0;
    background:center/cover no-repeat;
    z-index:0;
  }

  /* 화면 정가운데 */
  #stageWrap{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
    pointer-events:none;
  }

  /* ✅ Stage는 fitStage()가 스케일을 잡고,
        내부 content는 --cardScale로 한 번 더 0.8 축소 */
  #stage{
    width:calc(var(--baseW) * 1px);
    transform-origin:center center;
    pointer-events:auto;
  }
  #stageInner{
    transform: scale(var(--cardScale));
    transform-origin:center center;
  }

  .view{
    width:100%;
    display:none;
    box-sizing:border-box;
    padding:22px;
  }
  .view.active{ display:block; }

  .panel{
    display:flex;
    flex-direction:column;
    gap:16px;
    align-items:center;
    justify-content:center;
  }

  .card{
    width:100%;
    background:var(--cardBg);
    border:2px solid var(--border);
    padding:14px;
    box-sizing:border-box;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .topTitle{
    font-weight:900;
    font-size:26px;
    letter-spacing:0.3px;
    text-align:center;
    flex:1;
  }
  .btnRow{
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
  }
  button{
    border:2px solid var(--border);
    background:#fff;
    padding:10px 12px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    white-space:nowrap;
  }
  button:active{ transform: translateY(1px); }

  /* =========================
     화면1: 피라미드 2 + 3
     ========================= */
  .zPyramid{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:6px 0;
    box-sizing:border-box;
  }
  .zRow{
    display:flex;
    justify-content:center;
    gap:14px;
    width:100%;
  }
  .zRow.top{ max-width: 760px; }
  .zRow.bottom{ max-width: 980px; }

  .slot{
    flex:1 1 0;
    max-width: 310px;
    aspect-ratio: 1 / 1;
    border:2px solid var(--border);
    background:#fff;
    overflow:hidden;
    position:relative;
  }
  .slot img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    user-select:none;
  }

  /* kill.png가 박스 전체 덮기 */
  .overlayMark{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .overlayMark img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .slot.killed .overlayMark{ display:flex; }

  /* =========================
     duty 이미지
     ========================= */
  .dutyCard{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .dutyImg{
    width:var(--dutyW);
    height:var(--dutyH);
    max-width:100%;
    max-height:var(--dutyMaxH);
    object-fit:contain;
    user-select:none;
    pointer-events:none;
    display:block;
  }

  /* =========================
     화면3: 미션 3개 (3:4)
     ========================= */
  .mGrid{
    width:100%;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
    align-items:center;
    justify-items:center;
  }
  .mGrid .mSlot{
    width:100%;
    max-width:320px;
    aspect-ratio: 3 / 4;
    border:2px solid var(--border);
    background:#fff;
    overflow:hidden;
    position:relative;
  }
  .mGrid .mSlot img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    user-select:none;
  }
  .mSlot.cleared .overlayMark{ display:flex; }

  /* =========================
     화면2/4: 16:9 비디오 카드
     ========================= */
  .videoCard{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .videoFrame{
    width:100%;
    max-width: 980px;
    aspect-ratio: 16 / 9;
    border:2px solid var(--border);
    background:#000;
    overflow:hidden;
    position:relative;
  }
  video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
  }

  .hint{
    font-size:12px;
    opacity:0.7;
    text-align:left;
    width:100%;
  }
</style>
</head>

<body>
  <div id="bg"></div>

  <div id="stageWrap">
    <div id="stage">
      <div id="stageInner">

        <!-- 화면 1 (밤) -->
        <section id="view1" class="view active" aria-label="night screen">
          <div class="panel">
            <div class="card topbar">
              <div class="topTitle" id="titleNight">day 1 ㅣ 밤 🌙</div>
              <div class="btnRow">
                <button id="dayMinus1">-1일</button>
                <button id="dayPlus1">+1일</button>
                <button id="dayReset1">리셋</button>
              </div>
            </div>

            <div class="card dutyCard">
              <img id="dutyImg" class="dutyImg" alt="">
            </div>

            <div class="card">
              <div class="zPyramid" id="zGrid">
                <div class="zRow top">
                  <div class="slot" data-i="0">
                    <img src="static/zombie.png" alt="">
                    <div class="overlayMark"><img src="static/kill.png" alt=""></div>
                  </div>
                  <div class="slot" data-i="1">
                    <img src="static/zombie.png" alt="">
                    <div class="overlayMark"><img src="static/kill.png" alt=""></div>
                  </div>
                </div>

                <div class="zRow bottom">
                  <div class="slot" data-i="2">
                    <img src="static/zombie.png" alt="">
                    <div class="overlayMark"><img src="static/kill.png" alt=""></div>
                  </div>
                  <div class="slot" data-i="3">
                    <img src="static/zombie.png" alt="">
                    <div class="overlayMark"><img src="static/kill.png" alt=""></div>
                  </div>
                  <div class="slot" data-i="4">
                    <img src="static/zombie.png" alt="">
                    <div class="overlayMark"><img src="static/kill.png" alt=""></div>
                  </div>
                </div>
              </div>

              <div class="hint">* 5개 전부 kill → change.mp3 → clearzombie.mp3 → 화면2</div>
            </div>
          </div>
        </section>

        <!-- 화면 2 (nighttoday.mp4 + day.mp3) -->
        <section id="view2" class="view" aria-label="transition screen">
          <div class="panel">
            <div class="card videoCard">
              <div class="videoFrame">
                <video id="nightVideo" playsinline webkit-playsinline preload="auto">
                  <source src="static/nighttoday.mp4" type="video/mp4">
                </video>
              </div>
            </div>
            <div class="hint">* 영상 + day.mp3 동시에 → 영상 끝나면 1초 후 화면3</div>
          </div>
        </section>

        <!-- 화면 3 (낮) -->
        <section id="view3" class="view" aria-label="day screen">
          <div class="panel">
            <div class="card topbar">
              <div class="topTitle" id="titleDay">day 1 ㅣ 낮 ☀️</div>
              <div class="btnRow">
                <button id="dayMinus3">-1일</button>
                <button id="dayPlus3">+1일</button>
                <button id="dayReset3">리셋</button>
              </div>
            </div>

            <div class="card dutyCard">
              <img id="dutyImgDay" class="dutyImg" alt="">
            </div>

            <div class="card">
              <div class="mGrid" id="mGrid">
                <div class="mSlot" data-i="0">
                  <img src="static/mission1.png" alt="">
                  <div class="overlayMark"><img src="static/clear.png" alt=""></div>
                </div>
                <div class="mSlot" data-i="1">
                  <img src="static/mission2.png" alt="">
                  <div class="overlayMark"><img src="static/clear.png" alt=""></div>
                </div>
                <div class="mSlot" data-i="2">
                  <img src="static/mission3.png" alt="">
                  <div class="overlayMark"><img src="static/clear.png" alt=""></div>
                </div>
              </div>

              <div class="hint">* 3개 전부 clear → change.mp3 → clearmission.mp3 → 화면4(전환)</div>
            </div>
          </div>
        </section>

        <!-- ✅ 화면 4 (daytonight.mp4 + night.mp3) -->
        <section id="view4" class="view" aria-label="day-to-night transition screen">
          <div class="panel">
            <div class="card videoCard">
              <div class="videoFrame">
                <video id="dayToNightVideo" playsinline webkit-playsinline preload="auto">
                  <source src="static/daytonight.mp4" type="video/mp4">
                </video>
              </div>
            </div>
            <div class="hint">* daytonight.mp4 + night.mp3 동시에 → 영상 끝나면 1초 후 화면1</div>
          </div>
        </section>

      </div>
    </div>
  </div>

<script>
/* ✅ 스크롤 완전 방지 */
document.addEventListener('touchmove', (e)=> e.preventDefault(), {passive:false});

/* =========================================================
   ✅ Stage 자동 확대/축소
   (중요) stageInner에 scale(0.8)이 들어가 있으므로
          높이 측정은 stageInner 기준으로 해야 "카드가 진짜로 80%"가 됨
   ========================================================= */
function fitStage(){
  const stage = document.getElementById('stage');
  const inner = document.getElementById('stageInner');
  const baseW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--baseW')) || 1100;

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  stage.style.transform = 'scale(1)';

  // inner가 0.8로 줄어든 최종 높이를 기준으로 맞춤
  const baseH = (inner ? inner.scrollHeight : stage.scrollHeight) || 1;

  const s = Math.min(vw / baseW, vh / baseH);
  stage.style.transform = `scale(${s})`;
  stage.style.transformOrigin = 'center center';
}
window.addEventListener('load', ()=> requestAnimationFrame(fitStage));
window.addEventListener('resize', ()=> requestAnimationFrame(fitStage));

/* =========================================================
   오디오 유틸
   ========================================================= */
function playSound(audioEl, src){
  try{
    if(src) audioEl.src = src;
    audioEl.pause();
    audioEl.currentTime = 0;
    const p = audioEl.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
async function playSequence(list){
  for(const it of list){
    await new Promise((resolve)=>{
      const el = it.el;
      el.onended = ()=> resolve();
      el.onerror = ()=> resolve();
      playSound(el, it.src);
    });
  }
}

/* =========================================================
   상태(day 유지)
   ========================================================= */
let dayNum = 1;
function clampDay(){ if(!Number.isFinite(dayNum)) dayNum=1; if(dayNum<0) dayNum=0; }
function updateTitles(){
  clampDay();
  document.getElementById('titleNight').textContent = `day ${dayNum} ㅣ 밤 🌙`;
  document.getElementById('titleDay').textContent   = `day ${dayNum} ㅣ 낮 ☀️`;
}

/* =========================================================
   배경(밤/낮) + duty 이미지
   ========================================================= */
const bgEl = document.getElementById('bg');
const dutyNightEl = document.getElementById('dutyImg');
const dutyDayEl   = document.getElementById('dutyImgDay');

function setModeAssets(mode){
  bgEl.style.backgroundImage = (mode === "DAY")
    ? 'url("static/background-day.png")'
    : 'url("static/background-night.png")';

  if(dutyNightEl) dutyNightEl.src = "static/duty-night.png";
  if(dutyDayEl)   dutyDayEl.src   = "static/duty-day.png";
}

/* =========================================================
   화면 전환
   ========================================================= */
const view1 = document.getElementById('view1');
const view2 = document.getElementById('view2');
const view3 = document.getElementById('view3');
const view4 = document.getElementById('view4');

function showView(n){
  [view1,view2,view3,view4].forEach(v=> v.classList.remove('active'));

  if(n === 1){ view1.classList.add('active'); setModeAssets("NIGHT"); }
  if(n === 2){ view2.classList.add('active'); setModeAssets("NIGHT"); }
  if(n === 3){ view3.classList.add('active'); setModeAssets("DAY"); }
  if(n === 4){ view4.classList.add('active'); setModeAssets("NIGHT"); } // 전환 영상은 밤으로 복귀 느낌

  updateTitles();
  requestAnimationFrame(fitStage);
}

/* day 버튼(화면1/3 공통) */
function bindDayButtons(minusId, plusId, resetId){
  document.getElementById(minusId).addEventListener('click', ()=>{
    dayNum -= 1; clampDay(); updateTitles(); requestAnimationFrame(fitStage);
  });
  document.getElementById(plusId).addEventListener('click', ()=>{
    dayNum += 1; 
    warmUpAudio();
    playSound(aFullHeart, "static/fullheart.mp3");
    clampDay(); updateTitles(); requestAnimationFrame(fitStage);
  });
  document.getElementById(resetId).addEventListener('click', ()=>{
    dayNum = 1; updateTitles(); requestAnimationFrame(fitStage);
  });
}
bindDayButtons('dayMinus1','dayPlus1','dayReset1');
bindDayButtons('dayMinus3','dayPlus3','dayReset3');

/* =========================================================
   오디오 엘리먼트
   ========================================================= */
const aChange = new Audio("static/change.mp3");
const aClearZ = new Audio("static/clearzombie.mp3");
const aDay    = new Audio("static/day.mp3");
const aCM     = new Audio("static/clearmission.mp3");
const aNight  = new Audio("static/night.mp3");        // ✅ 추가
const aFullHeart = new Audio("static/fullheart.mp3");


let audioReady = false;
function warmUpAudio(){
  if(audioReady) return;
  [aChange, aClearZ, aDay, aCM, aNight, aFullHeart].forEach(el=>{
    try{
      el.muted = true;
      const p = el.play();
      if(p && p.catch) p.catch(()=>{});
      el.pause(); el.currentTime = 0;
      el.muted = false;
    }catch(e){}
  });
  audioReady = true;
}

/* =========================================================
   화면1: 좀비 5개 토글
   ========================================================= */
let zLock = false;
function checkAllZombieKilled(){
  const slots = [...document.querySelectorAll('#zGrid .slot')];
  return slots.every(s => s.classList.contains('killed'));
}
function resetZombies(){
  [...document.querySelectorAll('#zGrid .slot')].forEach(s=> s.classList.remove('killed'));
  zLock = false;
}

document.querySelectorAll('#zGrid .slot').forEach(slot=>{
  slot.addEventListener('click', async ()=>{
    warmUpAudio();
    if(zLock) return;

    slot.classList.toggle('killed');

    if(checkAllZombieKilled()){
      zLock = true;
      await playSequence([
        { el: aChange, src: "static/change.mp3" },
        { el: aClearZ, src: "static/clearzombie.mp3" }
      ]);
      showView(2);
      startScreen2();
    }
  });
});

/* =========================================================
   화면3: 미션 3개 토글
   ========================================================= */
let mLock = false;
function checkAllMissionCleared(){
  const slots = [...document.querySelectorAll('#mGrid .mSlot')];
  return slots.every(s => s.classList.contains('cleared'));
}
function resetMissions(){
  [...document.querySelectorAll('#mGrid .mSlot')].forEach(s=> s.classList.remove('cleared'));
  mLock = false;
}

document.querySelectorAll('#mGrid .mSlot').forEach(slot=>{
  slot.addEventListener('click', async ()=>{
    warmUpAudio();
    if(mLock) return;

    slot.classList.toggle('cleared');

    if(checkAllMissionCleared()){
      mLock = true;

      // 기존: change → clearmission 끝나면 화면1
      // 변경: change → clearmission 끝나면 화면4(전환 영상)로
      await playSequence([
        { el: aChange, src: "static/change.mp3" },
        { el: aCM, src: "static/clearmission.mp3" }
      ]);

      showView(4);
      startScreen4(); // ✅ daytonight.mp4 + night.mp3 동시
    }
  });
});

/* =========================================================
   화면2: nighttoday.mp4 + day.mp3
   ========================================================= */
const nightVideo = document.getElementById('nightVideo');
let screen2Running = false;

function stopScreen2(){
  screen2Running = false;
  try{ nightVideo.pause(); nightVideo.currentTime = 0; }catch(e){}
  try{ aDay.pause(); aDay.currentTime = 0; }catch(e){}
}
function startScreen2(){
  stopScreen2();
  warmUpAudio();
  screen2Running = true;

  try{
    nightVideo.currentTime = 0;
    const pv = nightVideo.play();
    if(pv && pv.catch) pv.catch(()=>{});
  }catch(e){}
  playSound(aDay, "static/day.mp3");

  nightVideo.onended = ()=>{
    if(!screen2Running) return;
    setTimeout(()=>{
      if(!screen2Running) return;
      stopScreen2();
      resetMissions();
      showView(3);
    }, 1000);
  };

  requestAnimationFrame(fitStage);
}

/* =========================================================
   ✅ 화면4: daytonight.mp4 + night.mp3 (동시)
   - 영상 끝나면 1초 뒤 화면1로 완전히 넘어감
   ========================================================= */
const dayToNightVideo = document.getElementById('dayToNightVideo');
let screen4Running = false;

function stopScreen4(){
  screen4Running = false;
  try{ dayToNightVideo.pause(); dayToNightVideo.currentTime = 0; }catch(e){}
  try{ aNight.pause(); aNight.currentTime = 0; }catch(e){}
}
function startScreen4(){
  stopScreen4();
  warmUpAudio();
  screen4Running = true;

  try{
    dayToNightVideo.currentTime = 0;
    const pv = dayToNightVideo.play();
    if(pv && pv.catch) pv.catch(()=>{});
  }catch(e){}
  playSound(aNight, "static/night.mp3");

  dayToNightVideo.onended = ()=>{
    if(!screen4Running) return;
    setTimeout(()=>{
      if(!screen4Running) return;
      stopScreen4();

      // ✅ 다음 사이클 준비
      resetZombies();
      resetMissions();
      zLock = false;
      mLock = false;

      showView(1);
    }, 1000);
  };

  requestAnimationFrame(fitStage);
}

/* =========================================================
   초기
   ========================================================= */
(function init(){
  updateTitles();
  resetZombies();
  resetMissions();

  dutyNightEl.src = "static/duty-night.png";
  dutyDayEl.src   = "static/duty-day.png";

  showView(1);
})();
</script>
</body>
</html>
